name: android

# The phone app builds on every change that touches it, and the build itself
# refuses to produce an APK that could reach the network - see
# android/no-internet.gradle.kts. That check runs here too, on a machine that
# has never seen this laptop's setup.
on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest --console=plain

      - name: Build the APK, and prove it cannot reach the network
        working-directory: android
        run: ./gradlew :app:assembleDebug --console=plain

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: emb3r-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
